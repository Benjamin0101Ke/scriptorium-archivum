<label [for]="searchId()">{{ label() }}</label>
@if (selected().length) {
  <ul>
    @for (person of selected(); track person.id) {
      <li>
        {{ person.nombre }}
        <button
          type="button"
          class="secondary small"
          (click)="remove(person.id)"
          [attr.aria-label]="'Quitar ' + person.nombre"
        >
          Quitar
        </button>
      </li>
    }
  </ul>
}
<input
  [id]="searchId()"
  type="search"
  placeholder="Nombre o apellido"
  [(ngModel)]="query"
  [ngModelOptions]="{ standalone: true }"
  [attr.aria-invalid]="invalid()"
  [attr.aria-describedby]="invalid() ? searchId() + '-error' : null"
  (keydown.enter)="$event.preventDefault(); search()"
/>
<button type="button" class="secondary small" (click)="search()" [disabled]="busy()">
  {{ busy() ? 'Buscando…' : 'Buscar personas' }}
</button>
@if (error()) {
  <p class="notice error" role="alert">{{ error() }}</p>
}
@if (results(); as people) {
  @if (people.length) {
    <ul>
      @for (person of people; track person.id) {
        <li>
          <button
            type="button"
            class="secondary small"
            (click)="add(person)"
            [disabled]="isSelected(person.id)"
          >
            {{ isSelected(person.id) ? 'Seleccionado' : 'Agregar' }} · {{ person.nombre }}
          </button>
        </li>
      }
    </ul>
  } @else {
    <p class="muted" role="status">No hay coincidencias.</p>
  }
}
