services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: scriptorium_archivum
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en el archivo .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql-init:/docker-entrypoint-initdb.d:ro

  api:
    build:
      context: ${API_PROJECT_PATH:-./APIScriptoriumArchivum}
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      RedireccionHttps: "false"
      ConnectionStrings__Scriptorium: Host=postgres;Port=5432;Database=scriptorium_archivum;Username=postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en el archivo .env}
      Correo__Host: ${SMTP_HOST:-mailpit}
      Correo__Puerto: ${SMTP_PORT:-1025}
      Correo__Tls: "${SMTP_TLS:-false}"
      Correo__Remitente: ${SMTP_FROM:-no-responder@scriptorium.test}
      Correo__Usuario: ${SMTP_USER:-}
      Correo__Password: ${SMTP_PASSWORD:-}
      Correo__Avisos: ${SMTP_AVISOS:-}
      Correo__AvisosAcceso: "${SMTP_AVISOS_ACCESO:-true}"
    ports:
      - "127.0.0.1:${API_PORT:-3000}:8080"
    depends_on:
      - postgres
    volumes:
      - ./storage/trabajos:/app/storage/trabajos
      - api_keys:/home/app/.aspnet/DataProtection-Keys

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@scriptorium.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Configura PGADMIN_DEFAULT_PASSWORD en el archivo .env}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5052}:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

volumes:
  postgres_data:
  pgadmin_data:
  api_keys:
